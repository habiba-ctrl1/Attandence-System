name: myapp
description: Smart Attendance System - Professional Edition
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  mobile_scanner: ^5.1.0
  lottie: ^3.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
